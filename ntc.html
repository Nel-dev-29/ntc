<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NTC INTERNS</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: start center;
            padding-top: 2rem;
            background: #000;
            color: #fff;
            font-family: "Arial Black", Arial, sans-serif;
            overflow-y: auto;
        }

        .landing {
            width: min(92vw, 900px);
            text-align: center;
            padding: 2rem 1rem;
        }

        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .site-logo {
            width: min(180px, 24vw);
            max-width: 220px;
            height: auto;
            display: block;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 5.8rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            animation: glowIn 1.2s ease-out both, pulse 2.8s ease-in-out infinite 1.2s;
        }

        .photo-wrap {
            margin-top: clamp(1.5rem, 4vw, 3rem);
            display: inline-block;
            border-radius: 22px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 55px rgba(255, 255, 255, 0.15);
            animation: float 3.2s ease-in-out infinite;
        }

        .photo-wrap img {
            width: min(78vw, 420px);
            height: auto;
            display: block;
            animation: reveal 1.1s ease-out both 0.35s;
        }

        .hero-row {
            margin-top: clamp(2rem, 4vw, 3.5rem);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .explore-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 260px;
            min-height: 120px;
            padding: 1.5rem 2.2rem;
            border-radius: 40px;
            background: linear-gradient(135deg, #8f5cff, #ff3aa2);
            color: #fff;
            text-decoration: none;
            font: 900 clamp(1.1rem, 2.2vw, 1.7rem) "Arial Black", Arial, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            box-shadow: 0 25px 55px rgba(159, 63, 255, 0.35);
            transition: transform 0.25s ease, filter 0.25s ease, box-shadow 0.25s ease;
            animation: float 3.6s ease-in-out infinite;
        }

        .explore-link:hover,
        .explore-link:focus {
            transform: translateY(-4px) scale(1.02);
            filter: brightness(1.05);
            outline: none;
        }

        .explore-link::after {
            content: "\2192";
            margin-left: 0.8rem;
            font-size: 1.2em;
            opacity: 0.95;
        }

        .hero-row .photo-wrap {
            box-shadow: 0 26px 72px rgba(255, 255, 255, 0.18);
        }

        @media (max-width: 760px) {
            .hero-row {
                flex-direction: column;
            }

            .explore-link {
                width: 100%;
                max-width: 420px;
            }
        }

        @keyframes glowIn {
            0% {
                opacity: 0;
                transform: translateY(-28px) scale(0.94);
                text-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                text-shadow: 0 0 14px rgba(255, 255, 255, 0.45);
            }
        }

        @keyframes reveal {
            0% {
                opacity: 0;
                transform: scale(0.9);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.9;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main class="landing">
        <div class="header-top">
            <img class="site-logo" src="logo.png" alt="NTC Logo">
            <h1>NTC INTERNS</h1>
        </div>
        <div class="hero-row">
            <div class="photo-wrap">
                <img src="haha.jpeg" alt="NTC Interns">
            </div>
            <a class="explore-link" href="gallery.html">
                Click here to explore
            </a>
        </div>
    </main>
</body>
</html>
